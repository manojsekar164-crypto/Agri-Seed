services:

  mongodb:
    image: mongo:7
    container_name: seedify-mongodb
    restart: unless-stopped

    ports:
      - "27017:27017"

    volumes:
      - mongodb-data:/data/db

  backend:
    build:
      context: ./server
      dockerfile: Dockerfile

    container_name: seedify-backend
    restart: unless-stopped

    ports:
      - "5001:5000"

    depends_on:
      - mongodb

    environment:
      PORT: 5000
      DB_NAME: seedshop
      MONGODB_URI: mongodb://mongodb:27017

  frontend:
    build:
      context: ./seed-main
      dockerfile: Dockerfile

    container_name: seedify-frontend
    restart: unless-stopped

    ports:
      - "3000:5173"

    depends_on:
      - backend

    environment:
      VITE_API_URL: http://backend:5000

    working_dir: /app

    stdin_open: true
    tty: true

volumes:
  mongodb-data: